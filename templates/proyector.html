<!DOCTYPE html>
<html lang="es" data-theme="cyan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis · Proyector</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css', v=asset_v) }}">
<style>
  html, body { height: 100%; background: #03060c; overflow: hidden; }
  body { font-family: var(--mono); color: var(--text); display: grid; grid-template-rows: auto 1fr auto; cursor: default; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(90% 70% at 50% 40%, rgba(var(--a-rgb), .10), transparent 70%),
                repeating-linear-gradient(0deg, rgba(var(--a-rgb), .035) 0 1px, transparent 1px 34px),
                repeating-linear-gradient(90deg, rgba(var(--a-rgb), .03) 0 1px, transparent 1px 34px); }
  header, footer { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 2vw; padding: 2.2vh 3vw; }
  .who { font-family: var(--hud); font-size: clamp(16px, 2.4vw, 34px); letter-spacing: .18em; color: var(--a); text-transform: uppercase; }
  .sub { font-size: clamp(12px, 1.3vw, 20px); color: var(--muted); margin-top: .4vh; }
  .clock { font-family: var(--hud); font-weight: 700; font-size: clamp(22px, 3.6vw, 56px); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  main { position: relative; display: grid; place-items: center; padding: 2vh 4vw; min-height: 0; }
  .stage { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; animation: rise .35s ease-out; }
  .big-timer { font-family: var(--hud); font-weight: 700; font-size: clamp(80px, 22vw, 360px); line-height: 1; letter-spacing: .02em;
    color: var(--a2); text-shadow: 0 0 40px rgba(var(--a2-rgb), .45); font-variant-numeric: tabular-nums; }
  .big-timer.urgent { color: var(--err); text-shadow: 0 0 50px rgba(255, 77, 94, .6); animation: blink 1s steps(2) infinite; }
  .label { font-size: clamp(18px, 3vw, 46px); color: var(--text); margin-top: 2vh; }
  .ring { width: min(60vh, 60vw); height: 6px; margin: 3vh auto 0; background: rgba(var(--a2-rgb), .15); border-radius: 3px; overflow: hidden; }
  .ring i { display: block; height: 100%; background: var(--a2); box-shadow: 0 0 14px var(--a2); transition: width 1s linear; }
  .kicker { font-family: var(--hud); font-size: clamp(14px, 1.8vw, 26px); letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
  .name { font-family: var(--hud); font-weight: 700; font-size: clamp(48px, 11vw, 200px); line-height: 1.05; color: var(--a);
    text-shadow: 0 0 40px rgba(var(--a-rgb), .5); margin-top: 2vh; animation: pop .6s cubic-bezier(.2, .9, .3, 1.3); }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(30vw, 320px), 1fr)); gap: 2vw; width: 100%; max-height: 100%; overflow: auto; }
  .group { border: 1px solid rgba(var(--a-rgb), .4); background: rgba(var(--a-rgb), .06); border-radius: 14px; padding: 2vh 1.6vw; text-align: left; }
  .group h3 { font-family: var(--hud); font-size: clamp(14px, 1.7vw, 26px); letter-spacing: .2em; color: var(--a); margin-bottom: 1vh; }
  .group p { font-size: clamp(16px, 2vw, 32px); line-height: 1.45; }
  .img { max-width: 100%; max-height: 74vh; border-radius: 14px; box-shadow: 0 0 60px rgba(var(--a-rgb), .25); }
  .idle-clock { white-space: nowrap; font-family: var(--hud); font-weight: 700; font-size: clamp(90px, 20vw, 320px); color: var(--a); text-shadow: 0 0 50px rgba(var(--a-rgb), .4); font-variant-numeric: tabular-nums; }
  footer { font-size: clamp(11px, 1.1vw, 16px); color: var(--muted); }
  footer b { color: var(--a); font-weight: 400; }
  /* 9.6: clase en vivo y ticket */
  .lc { width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: 2.4vh; text-align: left; }
  .lc-pills { display: flex; gap: .8vw; flex-wrap: wrap; }
  .lc-pills span { padding: .6vh 1vw; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: clamp(11px, 1.1vw, 18px); }
  .lc-pills span.on { border-color: var(--a); color: var(--a); background: rgba(var(--a-rgb), .1); }
  .lc-pills span.done { color: var(--ok); border-color: rgba(61, 255, 154, .4); }
  .lc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; }
  .lc-name { font-family: var(--hud); font-weight: 700; font-size: clamp(28px, 4.4vw, 76px); color: var(--a); text-transform: uppercase; letter-spacing: .06em; }
  .lc-time { font-family: var(--hud); font-weight: 700; font-size: clamp(40px, 7vw, 120px); color: var(--a2); font-variant-numeric: tabular-nums; }
  .lc-time.over { color: var(--err); animation: blink 1s steps(2) infinite; }
  .lc-act { font-size: clamp(16px, 2vw, 32px); line-height: 1.45; color: var(--text); white-space: pre-wrap; max-height: 40vh; overflow: hidden; }
  .lc-hook { font-size: clamp(22px, 3.2vw, 56px); font-weight: 700; line-height: 1.25; padding: 2.4vh 2vw; border-left: 5px solid var(--a2);
    background: rgba(var(--a2-rgb), .08); border-radius: 0 14px 14px 0; }
  .tk { display: flex; gap: 4vw; align-items: center; justify-content: center; }
  .tk img { width: min(42vh, 40vw); height: min(42vh, 40vw); background: #fff; padding: 12px; border-radius: 14px; image-rendering: pixelated; }
  .tk-info { text-align: left; max-width: 46vw; }
  .tk-n { font-family: var(--hud); font-weight: 700; font-size: clamp(50px, 8vw, 140px); color: var(--a); }
  .tk-url { font-size: clamp(14px, 1.6vw, 26px); color: var(--muted); word-break: break-all; margin-top: 2vh; }
  .res { width: 100%; max-width: 1300px; display: flex; flex-direction: column; gap: 2.6vh; text-align: left; }
  .res-row { display: grid; grid-template-columns: minmax(0, 1fr) 8ch; gap: 1.6vw; align-items: center; font-size: clamp(16px, 2vw, 32px); }
  .res-bar { grid-column: 1 / -1; height: 18px; border-radius: 9px; background: rgba(var(--a-rgb), .12); overflow: hidden; display: flex; }
  .res-bar i { display: block; height: 100%; }
  .res-pct { font-family: var(--hud); font-weight: 700; color: var(--a); text-align: right; }
  /* 9.4: modo tutor */
  .tv { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 3vh; text-align: left; }
  .tv-q { font-size: clamp(20px, 2.6vw, 44px); color: var(--a2); line-height: 1.3; }
  .tv-q::before { content: "Pregunta: "; color: var(--muted); font-size: .7em; }
  .tv-a { font-size: clamp(22px, 3vw, 52px); line-height: 1.35; padding: 2.4vh 2vw; border-left: 4px solid var(--a);
    background: rgba(var(--a-rgb), .06); border-radius: 0 14px 14px 0; }
  /* 8.8: quiz en vivo */
  .lq { width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: 2.4vh; text-align: left; }
  .lq-top { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--hud); letter-spacing: .2em;
    text-transform: uppercase; color: var(--muted); font-size: clamp(12px, 1.4vw, 22px); }
  .lq-ctx { font-size: clamp(14px, 1.6vw, 26px); line-height: 1.45; color: #a9c3d8; border-left: 3px solid var(--line-strong); padding-left: 1.2vw; max-height: 22vh; overflow: auto; }
  .lq-q { font-size: clamp(22px, 3.2vw, 56px); line-height: 1.25; font-weight: 700; }
  .lq-ops { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vw; }
  .lq-op { display: flex; gap: 1.2vw; align-items: center; padding: 2vh 1.6vw; border: 2px solid rgba(var(--a-rgb), .35); border-radius: 14px;
    background: rgba(var(--a-rgb), .06); font-size: clamp(18px, 2.3vw, 40px); transition: all .35s; }
  .lq-op b { font-family: var(--hud); color: var(--a); min-width: 1.4em; }
  .lq-op.ok { border-color: var(--ok); background: rgba(61, 255, 154, .16); box-shadow: 0 0 30px rgba(61, 255, 154, .3); }
  .lq-op.ok b { color: var(--ok); }
  .lq-op.no { opacity: .35; }
  .lq-exp { font-size: clamp(16px, 1.8vw, 30px); color: var(--ok); line-height: 1.4; }
  .lq-bar { height: 8px; border-radius: 4px; background: rgba(var(--a2-rgb), .15); overflow: hidden; }
  .lq-bar i { display: block; height: 100%; background: var(--a2); box-shadow: 0 0 14px var(--a2); transition: width 1s linear; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes blink { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .stage, .name { animation: none; } }
</style>
</head>
<body>
<header>
  <div><div class="who" id="who">Jarvis</div><div class="sub" id="sub"></div></div>
  <div class="clock" id="clock">--:--</div>
</header>
<main><div class="stage" id="stage"></div></main>
<footer>
  <span>Di «<b>Jarvis, escoge un estudiante</b>», «<b>haz grupos de 4</b>», «<b>pon un temporizador de 10 minutos</b>» o «<b>hazme una ilustración de…</b>»</span>
  <span>F11 · pantalla completa</span>
</footer>
<script src="{{ url_for('static', filename='vendor/socket.io.min.js', v=asset_v) }}"></script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const stage = $("#stage");
  let st = { timers: [], last: null, imagen: -1, clase: "", hasta: "" };
  let live = { on: false }, liveEnd = 0, liveDone = 0;
  let tutor = { on: false, materia: "", msgs: [] };
  let lclass = { on: false }, lclassEnd = 0, tk = { open: false }, tkRes = null, tkResAt = 0;
  let show = "idle", shownAt = 0, lastTick = Date.now();
  const p2 = (n) => String(n).padStart(2, "0");
  const hhmm = () => { const d = new Date(); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const fmt = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}:${p2(m)}:${p2(s % 60)}` : `${m}:${p2(s % 60)}`; };
  function node(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function header() {
    $("#who").textContent = st.clase || "Jarvis";
    $("#sub").textContent = [st.institucion, st.hasta ? `hasta las ${st.hasta}` : ""].filter(Boolean).join(" · ");
  }
  function render() {
    stage.innerHTML = "";
    const box = node("div", "stage-in");
    const t = st.timers[0];
    if (!live.on && tk.open) {
      const w = node("div", "tk");
      const im = node("img"); im.src = `${tk.qr || "/ticket-qr.png"}?t=${Math.floor(Date.now() / 4096)}`; im.alt = "Código QR";
      const info = node("div", "tk-info");
      info.append(node("div", "kicker", tk.tipo === "semaforo" ? "¿Cómo te fue? Escanea y responde" : tk.tipo === "practica" ? "Práctica personal · escanea y entra con tu nombre" : tk.tipo === "saber" ? "Mini simulacro Saber · escanea y responde" : "Ticket de salida · escanea y responde"),
                  node("div", "tk-n", String(tk.n || 0)), node("div", "label", "respuestas"), node("div", "tk-url", tk.url || ""));
      w.append(im, info); box.append(w); stage.append(box); header(); return;
    }
    if (!live.on && tkRes && Date.now() - tkResAt < 60000) {
      const r = node("div", "res");
      r.append(node("div", "kicker", `Resultados · ${tkRes.n} respuestas`));
      if (tkRes.tipo === "semaforo" && tkRes.semaforo) {
        [["🟢 Lo entendí", tkRes.semaforo.verde, "var(--ok)"], ["🟡 Dudas", tkRes.semaforo.amarillo, "var(--a2)"], ["🔴 No lo entendí", tkRes.semaforo.rojo, "var(--err)"]].forEach(([l, v, c]) => {
          const row = node("div", "res-row"); row.append(node("span", "", l), node("span", "res-pct", v + " %"));
          const bar = node("div", "res-bar"); const i = node("i"); i.style.width = v + "%"; i.style.background = c; bar.append(i); row.append(bar); r.append(row);
        });
      } else {
        (tkRes.preguntas || []).forEach((p, k) => {
          const row = node("div", "res-row"); row.append(node("span", "", `${k + 1}. ${p.enunciado}`), node("span", "res-pct", (p.pct ?? 0) + " %"));
          const bar = node("div", "res-bar"); const i = node("i"); i.style.width = (p.pct ?? 0) + "%"; i.style.background = "var(--ok)"; bar.append(i); row.append(bar); r.append(row);
        });
      }
      box.append(r); stage.append(box); header(); return;
    }
    if (!live.on && lclass.on && !(t && t.remaining > 0)) {
      const c = node("div", "lc");
      const pills = node("div", "lc-pills");
      (lclass.pasos || []).forEach((p, k) => pills.append(node("span", k === lclass.i ? "on" : k < lclass.i ? "done" : "", p)));
      const row = node("div", "lc-row");
      const tm = node("div", "lc-time"); tm.id = "lctime";
      row.append(node("div", "lc-name", lclass.nombre), tm);
      c.append(pills, row);
      if (lclass.hook) c.append(node("div", "lc-hook", lclass.hook));
      c.append(node("div", "lc-act", lclass.actividades || ""));
      box.append(c); stage.append(box); header();
      $("#who").textContent = `Clase de ${lclass.tema}` + (lclass.curso ? ` · ${lclass.curso}` : "");
      tickClass(); return;
    }
    if (live.on) {
      const q = node("div", "lq");
      const top = node("div", "lq-top");
      top.append(node("span", "", `Pregunta ${live.n} de ${live.total}`), node("span", "", live.phase === "pregunta" ? "" : "Respuesta"));
      q.append(top);
      if (live.contexto) q.append(node("div", "lq-ctx", live.contexto));
      q.append(node("div", "lq-q", live.enunciado));
      const ops = node("div", "lq-ops");
      (live.opciones || []).forEach((o, k) => {
        const op = node("div", "lq-op" + (live.correcta >= 0 ? (k === live.correcta ? " ok" : " no") : ""));
        op.append(node("b", "", "ABCD"[k]), node("span", "", o));
        ops.append(op);
      });
      q.append(ops);
      if (live.phase === "pregunta") { const bar = node("div", "lq-bar"); const i = node("i"); i.id = "lqbar"; bar.append(i); q.append(bar); }
      if (live.explicacion) q.append(node("div", "lq-exp", "✓ " + live.explicacion));
      box.append(q);
    } else if (tutor.on && !(t && t.remaining > 0) && tutor.msgs.length) {
      const tv = node("div", "tv");
      tv.append(node("div", "kicker", "Modo tutor" + (tutor.materia ? " · " + tutor.materia : "")));
      tutor.msgs.slice(-2).forEach((m) => tv.append(node("div", m.role === "user" ? "tv-q" : "tv-a", m.text)));
      box.append(tv);
    } else if (tutor.on && !(t && t.remaining > 0)) {
      box.append(node("div", "kicker", "Modo tutor" + (tutor.materia ? " · " + tutor.materia : "")),
                 node("div", "label", "Pregúntale a Jarvis: «Jarvis, ¿cómo resuelvo…?». Te guiará con pistas, sin darte la respuesta."));
    } else if (Date.now() - liveDone < 8000) {
      box.append(node("div", "kicker", "Fin del quiz"), node("div", "name", "¡Buen trabajo!"));
    } else if (t && t.remaining > 0) {
      const big = node("div", "big-timer" + (t.remaining <= 10 ? " urgent" : ""), fmt(t.remaining));
      big.id = "bigt";
      box.append(big);
      if (t.label) box.append(node("div", "label", t.label));
      const r = node("div", "ring"); const i = node("i"); i.style.width = `${Math.max(0, 100 * t.remaining / (t.total || 1))}%`; i.id = "ringi"; r.append(i); box.append(r);
    } else if (show === "pick" && st.last && st.last.type === "pick") {
      box.append(node("div", "kicker", "Le toca a"), node("div", "name", st.last.name));
    } else if (show === "groups" && st.last && st.last.type === "groups") {
      const g = node("div", "groups");
      (st.last.groups || []).forEach((grp, k) => { const c = node("div", "group"); c.append(node("h3", "", `Grupo ${k + 1}`), node("p", "", grp.join(" · "))); g.append(c); });
      box.append(g);
    } else if (show === "image" && st.imagen >= 0) {
      const im = node("img", "img"); im.src = `/archivo/${st.imagen}?t=${shownAt}`; im.alt = "Imagen de la clase"; box.append(im);
    } else {
      box.append(node("div", "idle-clock", hhmm()));
    }
    stage.append(box);
    header();
  }
  function tick() {
    const now = Date.now(), dt = (now - lastTick) / 1000; lastTick = now;
    st.timers.forEach((t) => { t.remaining = Math.max(0, t.remaining - dt); });
    st.timers = st.timers.filter((t) => t.remaining > 0);
    $("#clock").textContent = hhmm();
    const b = document.getElementById("bigt");
    if (b && st.timers[0]) { b.textContent = fmt(st.timers[0].remaining); b.classList.toggle("urgent", st.timers[0].remaining <= 10);
      const r = document.getElementById("ringi"); if (r) r.style.width = `${100 * st.timers[0].remaining / (st.timers[0].total || 1)}%`; }
    else if (b || (show === "idle" && now % 60000 < 1000)) render();
    const lb = document.getElementById("lqbar");
    if (lb && live.on) lb.style.width = `${Math.max(0, 100 * (liveEnd - now) / 1000 / (live.secs || 30))}%`;
  }
  function tickClass() {
    const el = document.getElementById("lctime");
    if (!el || !lclass.on) return;
    const s = Math.round((lclassEnd - Date.now()) / 1000);
    el.textContent = s >= 0 ? fmt(s) : "+" + fmt(-s);
    el.classList.toggle("over", s < 0);
  }
  setInterval(tickClass, 500);
  setInterval(tick, 500);

  const socket = io();
  socket.on("connect", () => socket.emit("projector_state", {}, (s) => { st = Object.assign(st, s); if (s.theme) document.documentElement.dataset.theme = s.theme; if (st.last) show = st.last.type === "pick" ? "pick" : "groups"; render(); }));
  socket.on("timers", ({ timers }) => { st.timers = timers || []; lastTick = Date.now(); render(); });
  socket.on("aula", (e) => { if (e.type === "pick" || e.type === "groups") { st.last = e; show = e.type === "pick" ? "pick" : "groups"; shownAt = Date.now(); render(); } });
  socket.on("file_card", (c) => { if (c.image && c.id >= 0) { st.imagen = c.id; show = "image"; shownAt = Date.now(); render(); } });
  socket.on("settings_updated", (s) => { if (s && s.theme) document.documentElement.dataset.theme = s.theme; });
  socket.on("projector", (d) => { if (d && d.close) window.close(); });
  socket.on("live_class", (d) => { lclass = d || { on: false }; lclassEnd = Date.now() + (lclass.left || 0) * 1000; render(); });
  socket.on("ticket", (d) => { tk = d || { open: false }; if (d && d.results) { tkRes = d.results; tkResAt = Date.now(); } render(); });
  socket.on("connect", () => { socket.emit("live_class_state", {}); socket.emit("ticket_state", {}, (d) => { tk = d || { open: false }; render(); }); });
  socket.on("tutor", (d) => { tutor = Object.assign({ msgs: [] }, d || {}); render(); });
  socket.on("tutor_msg", (m) => { if (!tutor.on) return; tutor.msgs.push(m); tutor.msgs = tutor.msgs.slice(-6); render(); });
  socket.on("connect", () => socket.emit("tutor_state", {}, (d) => { tutor = Object.assign({ msgs: [] }, d || {}); render(); }));
  socket.on("live_quiz", (d) => {
    if (d && d.done) liveDone = Date.now();
    live = d || { on: false };
    liveEnd = Date.now() + (live.left || 0) * 1000;
    render();
  });
  socket.on("connect", () => socket.emit("live_quiz_state", {}));
})();
</script>
</body>
</html>
