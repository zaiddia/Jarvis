<!DOCTYPE html>
<html lang="es" data-theme="cyan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css', v=asset_v) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/hud.css', v=asset_v) }}">
</head>
<body data-size="compacto" data-state="idle">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></symbol>
  <symbol id="i-orb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7-8-1z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></symbol>
</svg>

<div class="shell" id="shell">
  <!-- Reactor: también sirve para arrastrar el HUD -->
  <div class="orb drag-zone" id="orb" title="Arrastra para mover · doble clic para cambiar de tamaño">
    <div class="reactor" id="reactor">
      <svg viewBox="0 0 100 100" class="reactor-svg" aria-hidden="true">
        <defs>
          <radialGradient id="coreGrad">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
            <stop offset=".4" stop-color="currentColor" stop-opacity=".85"/>
            <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="wave w1" cx="50" cy="50" r="16"/>
        <circle class="wave w2" cx="50" cy="50" r="16"/>
        <g class="ring spin-slow"><circle class="r-ticks" cx="50" cy="50" r="46"/></g>
        <g class="ring spin-a"><circle class="r-arc-a" cx="50" cy="50" r="38"/></g>
        <g class="ring spin-b"><circle class="r-arc-b" cx="50" cy="50" r="30"/></g>
        <circle class="r-inner" cx="50" cy="50" r="22"/>
        <g class="core">
          <circle class="core-glow" cx="50" cy="50" r="19" fill="url(#coreGrad)"/>
          <circle class="core-dot" cx="50" cy="50" r="7"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="head">
    <div class="titles drag-zone">
      <span class="brand">JARVIS</span>
      <span class="mode" id="mode" aria-live="polite">EN ESPERA</span>
    </div>
    <span class="vu" id="vu" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <div class="leds" id="leds">
      <i id="led-mic" title="Micrófono"></i><i id="led-ai" title="IA"></i><i id="led-tts" title="Voz"></i><i id="led-cop" class="cop" title="Copiloto: mirando tu pantalla" hidden></i><i id="led-net" class="net" title="Sin internet: Jarvis usa lo que hay en tu equipo" hidden></i>
    </div>
    <div class="win-btns">
      <button type="button" id="btn-size" title="Expandir"><svg class="i"><use href="#i-expand"/></svg></button>
      <button type="button" id="btn-orb" title="Reducir a orbe"><svg class="i"><use href="#i-orb"/></svg></button>
      <button type="button" id="btn-bell" title="Avisos"><svg class="i"><use href="#i-bell"/></svg><b class="badge" id="bell-n" hidden></b></button>
      <button type="button" id="btn-settings" title="Ajustes"><svg class="i"><use href="#i-sliders"/></svg></button>
      <button type="button" id="btn-hide" title="Ocultar (Ctrl+Alt+J para volver)"><svg class="i"><use href="#i-minus"/></svg></button>
      <button type="button" id="btn-quit" class="danger" title="Salir de Jarvis"><svg class="i"><use href="#i-power"/></svg></button>
    </div>
  </div>

  <div class="preview" id="preview"></div>

  <!-- 7.0: tarjeta holográfica (clima, agenda, rutinas, avisos…) -->
  <div class="holo" id="holo" hidden aria-live="polite">
    <div class="holo-k"><span class="holo-i" id="holo-i">✦</span><span id="holo-t"></span><span class="holo-time" id="holo-time"></span></div>
    <div class="holo-b" id="holo-b"></div>
    <div class="holo-steps" id="holo-steps" hidden></div>
    <div class="holo-bar"><i id="holo-bar"></i></div>
  </div>

  <div class="timers" id="timers" hidden></div>

  <div class="panel" id="panel">
    <div class="xtabs">
      <button type="button" class="xtab active" data-view="chat">Conversación</button>
      <button type="button" class="xtab" data-view="hoy" id="xtab-hoy">Hoy</button>
      <button type="button" class="xtab" data-view="log">Registro</button>
      <span class="spacer"></span>
      <input type="search" id="chat-q" class="chat-q" placeholder="Buscar en la conversación…" aria-label="Buscar en la conversación" hidden>
      <span class="logtools" id="logtools">
        <button type="button" class="lf active" data-f="all">Todo</button><button type="button" class="lf" data-f="error">Errores</button><button type="button" class="lf" data-f="warn">Avisos</button>
        <input type="search" id="log-q" placeholder="Buscar…" aria-label="Buscar en el registro">
      </span>
      <button type="button" class="text-btn" id="btn-clear" title="Nueva conversación"><svg class="i"><use href="#i-trash"/></svg>Nueva</button>
      <button type="button" class="text-btn icon" id="btn-dash" title="Ocultar el panel Hoy"><svg class="i"><use href="#i-panel"/></svg></button>
    </div>
    <div class="jobs" id="jobs" hidden></div>
    <div class="scroll" id="view-chat"><div class="chat" id="chat"></div></div>
    <div class="scroll" id="view-log" hidden><div class="log" id="log"></div></div>
    <div class="scroll" id="view-hoy" hidden></div>
  </div>

  <!-- 8.6: panel «Hoy» (al lado del chat si el HUD es ancho; si no, en la pestaña «Hoy») -->
  <aside class="dash" id="dash" aria-label="Hoy"></aside>

  <!-- 8.6: sugerencias según el momento -->
  <div class="chips" id="chips"></div>

  <!-- 9.2: campana de avisos -->
  <div class="ntc" id="ntc" hidden role="dialog" aria-label="Avisos">
    <div class="ntc-h"><span>Avisos</span><button type="button" class="text-btn" id="ntc-clear">Borrar</button></div>
    <div class="ntc-list" id="ntc-list"></div>
  </div>

  <!-- 8.6: paleta de órdenes (Ctrl+K) -->
  <div class="pal" id="pal" hidden role="dialog" aria-label="Buscar una orden">
    <div class="pal-in"><svg class="i"><use href="#i-search"/></svg><input type="text" id="pal-q" placeholder="Busca o escribe una orden… (Esc para cerrar)" autocomplete="off" spellcheck="false"></div>
    <div class="pal-list" id="pal-list"></div>
  </div>

  <form class="bar" id="bar" autocomplete="off">
    <button type="button" class="bar-btn" id="btn-mic" title="Pausar micrófono"><svg class="i"><use href="#i-mic"/></svg></button>
    <button type="button" class="bar-btn" id="btn-pal" title="Buscar una orden (Ctrl+K)"><svg class="i"><use href="#i-search"/></svg></button>
    <input type="text" id="input" maxlength="1000" placeholder="Escribe una orden…  (Ctrl+K busca · ↑ repite)" aria-label="Orden para Jarvis">
    <button type="submit" class="bar-btn send" id="btn-send" title="Enviar"><svg class="i"><use href="#i-send"/></svg></button>
    <button type="button" class="bar-btn stop" id="btn-stop" title="Detener voz"><svg class="i"><use href="#i-stop"/></svg></button>
  </form>
</div>

<script src="{{ url_for('static', filename='vendor/socket.io.min.js', v=asset_v) }}"></script>
<script src="{{ url_for('static', filename='js/hud.js', v=asset_v) }}"></script>
</body>
</html>
