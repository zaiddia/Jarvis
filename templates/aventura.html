<!DOCTYPE html>
<html lang="es" data-look="{{ look|default('clasico') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura matemática · Jarvis</title>
<style>
  :root { --a: #2ee6ff; --a2: #ffb547; --ok: #3dff9a; --bad: #ff6b6b; --bg: #03060c; --card: #071320; --line: #1d3344; --text: #e6f6ff; --muted: #7d95ab; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); overflow: hidden;
         background: radial-gradient(ellipse at 50% 120%, #10233a 0%, #03060c 60%); }
  .stars { position: fixed; inset: 0; background-image: radial-gradient(1px 1px at 20% 30%, #fff8, transparent), radial-gradient(1px 1px at 70% 20%, #fff6, transparent),
           radial-gradient(1.5px 1.5px at 40% 70%, #fff5, transparent), radial-gradient(1px 1px at 85% 60%, #fff7, transparent), radial-gradient(1px 1px at 10% 85%, #fff5, transparent);
           background-size: 400px 400px; animation: drift 90s linear infinite; pointer-events: none; }
  @keyframes drift { to { background-position: 400px 400px; } }
  main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; height: 100%; padding: 24px; }
  .scene { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  h1 { font-size: clamp(26px, 3.4vw, 44px); color: var(--a); letter-spacing: .5px; }
  .chap { color: var(--a2); font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
  .story { font-size: clamp(20px, 2.2vw, 30px); line-height: 1.45; max-width: 60ch; animation: fade .8s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .problem { background: var(--card); border: 2px solid var(--a2); border-radius: 18px; padding: 18px 22px; font-size: clamp(22px, 2.4vw, 34px); animation: fade .6s ease-out; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 18px; font-size: clamp(18px, 2vw, 28px); display: flex; gap: 12px; align-items: center; }
  .opt b { color: var(--a); font-size: 1.1em; }
  .opt.ok { border-color: var(--ok); background: #0d2a1d; } .opt.no { opacity: .45; }
  .door { width: 160px; height: 220px; position: relative; perspective: 600px; margin: 6px 0; }
  .door .frame { position: absolute; inset: 0; border: 6px solid #3a556c; border-radius: 80px 80px 6px 6px; background: #000 radial-gradient(circle at 50% 60%, #ffdd5580, transparent 60%); }
  .door .leaf { position: absolute; inset: 6px; border-radius: 74px 74px 2px 2px; background: repeating-linear-gradient(90deg, #4a3423 0 18px, #3d2b1d 18px 36px);
                transform-origin: left center; transition: transform 1.6s cubic-bezier(.2,.8,.2,1); box-shadow: inset 0 0 20px #0008; }
  .door.open .leaf { transform: rotateY(-105deg); }
  .door .lock { position: absolute; right: 22px; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--a2); box-shadow: 0 0 12px var(--a2); }
  .row { display: flex; gap: 24px; align-items: center; }
  .timer { font-size: 54px; font-weight: 800; color: var(--a2); font-variant-numeric: tabular-nums; min-width: 90px; }
  .timer.low { color: var(--bad); animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12); } }
  .count { color: var(--muted); font-size: 20px; }
  .expl { font-size: 22px; color: var(--ok); }
  aside { background: #071320cc; border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  aside h2 { font-size: 18px; color: var(--muted); }
  .team { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; font-size: 20px; }
  .team .bar { grid-column: 1 / -1; height: 8px; background: #0c1d2c; border-radius: 4px; overflow: hidden; }
  .team .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--a), var(--a2)); transition: width 1s; }
  .team b { color: var(--a2); font-variant-numeric: tabular-nums; }
  .plus { color: var(--ok); font-size: 15px; margin-left: 4px; }
  .qr { background: #fff; border-radius: 14px; padding: 10px; text-align: center; color: #03060c; }
  .qr img { width: 100%; max-width: 230px; display: block; margin: 0 auto; }
  .qr p { font-size: 12px; word-break: break-all; }
  .ctl { margin-top: auto; display: flex; gap: 8px; }
  button { flex: 1; font-size: 18px; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; background: var(--a); color: #03060c; }
  button.sec { background: var(--card); color: var(--muted); border: 1px solid var(--line); flex: 0 0 auto; }
  .doors { display: flex; gap: 6px; }
  .doors i { width: 18px; height: 24px; border-radius: 9px 9px 2px 2px; background: #1d3344; }
  .doors i.o { background: var(--ok); } .doors i.c { background: var(--bad); }
  .podium { display: flex; align-items: flex-end; gap: 18px; justify-content: center; margin-top: 20px; }
  .podium div { width: 180px; text-align: center; border-radius: 14px 14px 0 0; padding: 14px; font-size: 22px; background: var(--card); border: 2px solid var(--line); animation: rise 1s ease-out both; }
  @keyframes rise { from { transform: translateY(60px); opacity: 0; } }
  .podium .p1 { height: 240px; border-color: var(--a2); } .podium .p2 { height: 190px; animation-delay: .3s; } .podium .p3 { height: 150px; animation-delay: .6s; }
  .podium .e { font-size: 50px; display: block; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .empty { margin: auto; text-align: center; font-size: 24px; color: var(--muted); }
</style>
<style>{% include "_aurora.css" %}</style>
</head>
<body class="page">
<div class="stars"></div>
<main><section class="scene" id="scene"><div class="empty">Escribiendo la aventura… (di «lanza una aventura de fracciones para 7A»)</div></section>
<aside><h2>MARCADOR</h2><div id="teams"></div><div class="doors" id="doors"></div><div id="qr"></div>
<div class="ctl"><button id="next">Empezar ▶</button><button class="sec" id="end" title="Terminar">✕</button></div></aside></main>
<script src="{{ url_for('static', filename='vendor/socket.io.min.js', v=asset_v) }}"></script>
<script>
(() => {
  "use strict";
  const socket = io(), $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let st = null, lastFase = "", lastPts = {};
  const L = "ABCDEF";
  function teams() {
    const max = Math.max(1, ...st.equipos.map((e) => e.puntos));
    const u = (st.ultimo && st.fase === "revelar") ? st.ultimo.resultados : [];
    $("teams").innerHTML = st.equipos.map((e, i) => { const r = u.find((x) => x.equipo === i);
      return `<div class="team"><span>${e.emoji}</span><span>${esc(e.nombre)}${st.por_equipo ? ` <small style="color:#7d95ab">(${st.por_equipo[i]})</small>` : ""}${r && r.puntos ? `<span class="plus">+${r.puntos}</span>` : ""}</span><b>${e.puntos}</b><div class="bar"><i style="width:${100 * e.puntos / max}%"></i></div></div>`; }).join("");
    $("doors").innerHTML = Array.from({ length: st.n_caps }, (_, i) => `<i class="${i < st.puertas.length ? (st.puertas[i] ? "o" : "c") : ""}"></i>`).join("");
  }
  function render() {
    if (!st || st.none) { $("scene").innerHTML = '<div class="empty">No hay aventura abierta. Di «lanza una aventura de fracciones para 7A».</div>'; $("teams").innerHTML = ""; $("qr").innerHTML = ""; return; }
    teams();
    const s = $("scene"), f = st.fase;
    $("qr").innerHTML = (f === "sala" || f === "historia") ? `<div class="qr"><img src="/aventura-qr.png?v=${st.cap}" alt="QR"><p>${esc(st.url)}</p><p><b>${st.jugadores}</b> jugadores</p></div>` : "";
    $("next").textContent = { sala: "Empezar ▶", historia: "Mostrar el reto ▶", pregunta: "Revelar ▶", revelar: st.cap + 1 >= st.n_caps ? "Final ▶" : "Siguiente capítulo ▶", final: "—" }[f];
    $("next").disabled = f === "final";
    if (f === lastFase && f !== "pregunta") { return; }
    if (f === "sala") s.innerHTML = `<div class="chap">Misión</div><h1>${esc(st.titulo)}</h1><p class="story">${esc(st.intro)}</p><p class="count">Escaneen el QR, escriban su nombre y escojan equipo.</p>`;
    else if (f === "historia") s.innerHTML = `<div class="chap">Capítulo ${st.cap + 1} de ${st.n_caps}</div><h1>${esc(st.cap_titulo)}</h1><div class="row"><div class="door"><div class="frame"></div><div class="leaf"><span class="lock"></span></div></div><p class="story">${esc(st.historia)}</p></div>`;
    else if (f === "pregunta") {
      if (lastFase !== "pregunta") s.innerHTML = `<div class="chap">Capítulo ${st.cap + 1} · La puerta</div><div class="problem">${esc(st.problema)}</div>
        <div class="opts">${st.opciones.map((o, i) => `<div class="opt"><b>${L[i]}</b>${esc(o)}</div>`).join("")}</div>
        <div class="row"><div class="timer" id="tm">${st.restante ?? ""}</div><div class="count" id="cnt">${st.respondieron} de ${st.jugadores} respondieron</div></div>`;
      else if ($("cnt")) $("cnt").textContent = `${st.respondieron} de ${st.jugadores} respondieron`;
    } else if (f === "revelar") {
      const u = st.ultimo || {};
      s.innerHTML = `<div class="chap">Capítulo ${st.cap + 1}</div><div class="problem">${esc(st.problema)}</div>
        <div class="opts">${st.opciones.map((o, i) => `<div class="opt ${i === st.correcta ? "ok" : "no"}"><b>${L[i]}</b>${esc(o)}</div>`).join("")}</div>
        <div class="row"><div class="door" id="door"><div class="frame"></div><div class="leaf"><span class="lock"></span></div></div>
        <div><p class="story">${u.abierta ? "🔓 ¡La puerta se abre!" : "🔒 La puerta resiste… pero el equipo sigue adelante."}</p>
        <p class="count">Acertaron ${u.aciertos || 0} de ${u.respuestas || 0}</p><p class="expl">${esc(st.explicacion)}</p></div></div>`;
      if (u.abierta) setTimeout(() => { const d = $("door"); if (d) d.classList.add("open"); }, 300);
    } else if (f === "final") {
      const p = st.podio, e = st.equipos;
      s.innerHTML = `<div class="chap">Final</div><h1>${esc(st.titulo)}</h1><p class="story">${esc(st.final)}</p>
        <div class="podium">${[1, 0, 2].filter((k) => p[k] !== undefined).map((k) => `<div class="p${k + 1}"><span class="e">${e[p[k]].emoji}</span>${k + 1}.º ${esc(e[p[k]].nombre)}<br><b>${e[p[k]].puntos}</b></div>`).join("")}</div>`;
      confetti();
    }
    lastFase = f;
  }
  function confetti() { for (let i = 0; i < 120; i++) { const c = document.createElement("i"); c.className = "confetti"; c.style.left = Math.random() * 100 + "vw";
    c.style.background = ["#2ee6ff", "#ffb547", "#3dff9a", "#ff80ab", "#fff"][i % 5]; c.style.animationDuration = 2 + Math.random() * 3 + "s"; c.style.animationDelay = Math.random() * 2 + "s"; document.body.appendChild(c); setTimeout(() => c.remove(), 7000); } }
  socket.on("adv", (d) => { st = d; render(); });
  socket.on("adv_tick", (d) => { const t = $("tm"), c = $("cnt"); if (t) { t.textContent = d.restante; t.classList.toggle("low", d.restante <= 10); } if (c) c.textContent = `${d.respondieron} de ${d.jugadores} respondieron`; });
  socket.on("connect", () => socket.emit("adv_state", {}, (d) => { st = d; render(); }));
  $("next").onclick = () => socket.emit("adv_action", { a: "siguiente" });
  $("end").onclick = () => { if (confirm("¿Terminar la aventura?")) socket.emit("adv_action", { a: "terminar" }); };
})();
</script>
</body>
</html>
