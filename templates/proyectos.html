<!DOCTYPE html>
<html lang="es" data-theme="cyan" data-look="{{ look|default('clasico') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos · Jarvis</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css', v=asset_v) }}">
<style>
  html, body { min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% -10%, rgba(var(--a-rgb), .12), transparent 60%), var(--bg); color: var(--text);
         font-family: var(--mono); font-size: 13px; padding: 22px clamp(16px, 3vw, 40px) 50px; user-select: text; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-family: var(--hud); font-size: clamp(20px, 3vw, 28px); color: var(--a); letter-spacing: .12em; text-shadow: 0 0 16px rgba(var(--a-rgb), .5); }
  header p { color: var(--muted); margin-top: 6px; }
  .prj { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; background: rgba(var(--a-rgb), .03); }
  .prj.live { border-color: rgba(var(--a-rgb), .55); box-shadow: 0 0 18px rgba(var(--a-rgb), .12); }
  .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .top h2 { font-size: 15px; color: var(--text); flex: 1; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.en.marcha, .badge.run { color: var(--a); border-color: var(--a); }
  .badge.ok { color: #6fe3a5; border-color: rgba(111, 227, 165, .6); }
  .badge.bad { color: #ff9b9b; border-color: rgba(255, 120, 120, .6); }
  .ped { color: var(--muted); margin: 4px 0 10px; }
  .bar { height: 6px; border-radius: 6px; background: rgba(var(--a-rgb), .1); overflow: hidden; margin-bottom: 10px; }
  .bar i { display: block; height: 100%; background: var(--a); box-shadow: 0 0 10px var(--a); transition: width .4s; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 6px; border-top: 1px dashed rgba(var(--a-rgb), .14); vertical-align: top; }
  td.n { width: 26px; color: var(--muted); }
  td.e { width: 110px; white-space: nowrap; }
  td.m { width: 150px; color: var(--muted); font-size: 11.5px; }
  td.a { width: 90px; text-align: right; }
  .t { color: #bfefff; }
  .res { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.4; max-height: 3.9em; overflow: hidden; }
  .res.err { color: #ffb3b3; }
  .st-hecho { color: #6fe3a5; } .st-error, .st-omitido { color: #ff9b9b; } .st-en.marcha { color: var(--a); } .st-pendiente { color: var(--muted); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); background: transparent; cursor: pointer; font: inherit; font-size: 12px; }
  button:hover { color: var(--a); border-color: var(--a); }
  .rep { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(var(--a-rgb), .06); border: 1px solid rgba(var(--a-rgb), .25); }
  .rep h3 { font-size: 13px; color: var(--a); margin-bottom: 6px; }
  .rep li, .rep ol li { margin-left: 22px; color: #bfefff; line-height: 1.5; }
  .rev-ok { color: #6fe3a5; } .rev-bad { color: #ffd38a; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
<style>{% include "_aurora.css" %}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PROYECTOS</h1>
    <p>Cada paso, con qué modelo va, lo que encontró y el informe final. Se actualiza solo.</p>
  </header>
  <div id="list"><p class="empty">Cargando…</p></div>
  <p class="hint">Por voz: «¿cómo va el proyecto?», «pausa el proyecto», «sigue con el proyecto», «cambia la parte 2 del informe: …». Mientras trabaja puedes seguir hablándome de otras cosas.</p>
</div>
<script src="{{ url_for('static', filename='vendor/socket.io.min.js', v=asset_v) }}"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const socket = io();
  let board = [];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LIVE = (p) => p.estado === "en marcha";
  function dur(s) { if (!s.inicio) return ""; const t = Math.round(((s.fin || Date.now() / 1000) - s.inicio)); return t < 60 ? `${t} s` : `${Math.round(t / 60)} min`; }
  function card(p) {
    const n = p.pasos.length, done = p.pasos.filter((s) => s.estado === "hecho").length;
    const cls = LIVE(p) ? (p.pausado ? "badge" : "badge run") : p.estado === "terminado" ? "badge ok" : p.estado === "cancelado" ? "badge bad" : "badge";
    const rows = p.pasos.map((s, i) => `<tr>
        <td class="n">${i + 1}</td>
        <td><div class="t">${esc(s.titulo)}</div>${s.error ? `<div class="res err">${esc(s.error)}</div>` : s.resumen ? `<div class="res">${esc(s.resumen)}</div>` : ""}${s.archivo ? `<div class="res">📄 ${esc(s.archivo)}</div>` : ""}</td>
        <td class="e st-${esc(s.estado)}">${esc(s.estado)} ${dur(s)}</td>
        <td class="m">${esc(s.modelo || "")}</td>
        <td class="a">${s.estado !== "en marcha" && s.estado !== "pendiente" ? `<button data-a="redo" data-id="${esc(p.id)}" data-step="${esc(s.id)}">Rehacer</button>` : ""}</td>
      </tr>`).join("");
    let rep = "";
    if (p.informe) {
      const rv = p.informe.revision;
      const revTxt = !rv ? "<p class='rev-bad'>Cambiaste partes después de la revisión.</p>" : rv.veredicto === "bien" ? "<p class='rev-ok'>✓ El revisor no encontró problemas.</p>"
        : rv.veredicto === "revisar" ? `<p class="rev-bad">El revisor marcó ${rv.problemas.length} cosa(s):</p><ul>${rv.problemas.map((x) => `<li>${x.parte ? "Parte " + esc(x.parte) + ": " : ""}${esc(x.detalle)}</li>`).join("")}</ul>` : "";
      rep = `<div class="rep"><h3>Informe final: ${esc(p.informe.titulo)}</h3>
        <ol>${p.informe.partes.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>${revTxt}
        <div class="acts"><button data-a="report" data-id="${esc(p.id)}">Abrir el informe</button></div></div>`;
    }
    const acts = LIVE(p)
      ? `${p.pausado ? `<button data-a="resume" data-id="${esc(p.id)}">Seguir</button>` : `<button data-a="pause" data-id="${esc(p.id)}">Pausar</button>`}<button data-a="cancel" data-id="${esc(p.id)}">Cancelar</button>`
      : p.estado !== "terminado" && p.estado !== "cancelado" ? `<button data-a="resume" data-id="${esc(p.id)}">Continuar</button>` : "";
    return `<div class="prj ${LIVE(p) ? "live" : ""}">
      <div class="top"><h2>${esc(p.nombre)}</h2><span class="${cls}">${p.pausado ? "en pausa" : esc(p.estado)}</span><span class="badge">${done}/${n} pasos</span>${p.consumo ? `<span class="badge" title="Llamadas a la IA y tokens aproximados de este proyecto">IA: ${p.consumo.calls} llamadas · ~${p.consumo.tok >= 1000 ? (p.consumo.tok / 1000).toFixed(1) + " mil" : p.consumo.tok} tokens</span>` : ""}</div>
      <div class="ped">${esc(p.pedido)}</div>
      <div class="bar"><i style="width:${n ? Math.round(100 * done / n) : 0}%"></i></div>
      <table>${rows}</table>${rep}
      <div class="acts">${acts}<button data-a="open" data-id="${esc(p.id)}">Abrir la carpeta</button></div></div>`;
  }
  function draw() { $("#list").innerHTML = board.length ? board.map(card).join("") : '<p class="empty">Aún no hay proyectos. Pídeme uno: «organiza mi fin de semana», «prepárame la semana de 7A sobre fracciones».</p>'; }
  $("#list").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-a]");
    if (!b) return;
    b.disabled = true;
    socket.emit("project_action", { id: b.dataset.id, action: b.dataset.a, step: b.dataset.step || "" }, (r) => { if (r && r.board) { board = r.board; draw(); } });
  });
  const load = () => socket.emit("projects_state", {}, (r) => { board = (r && r.board) || []; draw(); });
  socket.on("connect", load);
  socket.on("project_update", (p) => { const i = board.findIndex((x) => x.id === p.id); if (i >= 0) board[i] = p; else board.unshift(p); draw(); });
  setInterval(() => { if (board.some(LIVE)) draw(); }, 5000);     // los tiempos avanzan
  socket.emit("get_settings", (r) => { if (r && r.settings && r.settings.theme) document.documentElement.dataset.theme = r.settings.theme; });
</script>
</body>
</html>
