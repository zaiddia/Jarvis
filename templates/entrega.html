<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrega tu programa</title>
<style>
  :root { --a: #2ee6ff; --a2: #ffb547; --ok: #3dff9a; --bad: #ff6b6b; --bg: #03060c; --card: #071320; --line: #1d3344; --text: #e6f6ff; --muted: #7d95ab; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 18px 16px 48px; line-height: 1.45; }
  h1 { font-size: 21px; color: var(--a); margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  select, input { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #2a4458; background: var(--card); color: var(--text); margin-bottom: 12px; }
  button { width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; background: var(--a); color: #03060c; margin-bottom: 10px; }
  button.ghost { background: none; border: 1px solid #2a4458; color: var(--text); font-weight: 500; }
  button:disabled { opacity: .5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .tag { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
  .q { font-size: 17px; font-weight: 600; margin-bottom: 14px; white-space: pre-wrap; }
  .op { display: block; width: 100%; text-align: left; padding: 13px; margin-bottom: 9px; border: 1px solid #2a4458; border-radius: 11px; background: #0a1a29;
    color: var(--text); font-size: 16px; font-weight: 500; }
  .op.bad { border-color: var(--bad); opacity: .55; } .op.good { border-color: var(--ok); background: #0b2a1c; }
  .fb { margin: 10px 0; font-size: 15px; } .fb.ok { color: var(--ok); font-weight: 700; } .fb.hint { color: var(--a2); }
  .exp { white-space: pre-wrap; font-size: 15px; color: var(--text); background: #0a1a29; border-radius: 10px; padding: 12px; margin: 8px 0 12px; }
  .msg { color: var(--a2); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  .topics span { display: inline-block; font-size: 13px; border: 1px solid #2a4458; border-radius: 999px; padding: 3px 10px; margin: 0 6px 6px 0; }
  .chat { margin-top: 6px; } .chat p { font-size: 14px; margin-bottom: 8px; } .chat p.me { color: var(--muted); }
  [hidden] { display: none !important; }
  textarea { width: 100%; min-height: 220px; padding: 12px; font: 14px/1.4 ui-monospace, Consolas, monospace; border-radius: 10px; border: 1px solid #2a4458;
    background: #050d17; color: var(--text); margin-bottom: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  ul { margin: 6px 0 10px 18px; } li { margin-bottom: 6px; font-size: 15px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; } .tabs button { margin: 0; } .tabs button.off { background: none; border: 1px solid #2a4458; color: var(--text); font-weight: 500; }
  .lvl { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
  .Bronce { background: #5a3a1c; color: #ffcf9e; } .Plata { background: #3b4552; color: #e2ebf3; } .Oro { background: #5c4a0f; color: #ffe27a; }
  .badges span { display: inline-block; font-size: 14px; border: 1px solid #2a4458; border-radius: 999px; padding: 3px 10px; margin: 0 6px 6px 0; }
</style>
</head>
<body>
<h1>Entrega tu programa</h1>
<p class="sub" id="curso">Tecnología e Informática</p>
<div class="card" id="consigna" hidden><div class="tag">La tarea</div><p id="ctext"></p></div>
<section id="login" class="card">
  <select id="nombre"><option value="">Escoge tu nombre…</option></select>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="Tu PIN de 4 números (el mismo de la práctica)">
  <button id="entrar">Entrar</button>
  <p class="msg" id="lmsg"></p>
</section>
<section id="send" hidden>
  <div class="card">
    <p id="hola" class="q"></p>
    <select id="lang"></select>
    <div class="tabs"><button id="tcode">Pegar código</button><button id="tfoto" class="off">Tomar foto</button></div>
    <textarea id="code" placeholder="Pega aquí tu código o tu pseudocódigo"></textarea>
    <div id="fotobox" hidden><input id="foto" type="file" accept="image/*" capture="environment"><p class="sub" id="fname"></p></div>
    <button id="enviar">Enviar para revisión</button>
    <p class="msg" id="smsg"></p>
  </div>
  <div class="card" id="rev" hidden>
    <div class="tag">Revisión de Jarvis (no ejecuta tu código: lo lee)</div>
    <p id="estado" class="q"></p>
    <div id="bien"></div><div id="errores"></div>
    <p id="pista" class="fb hint"></p>
    <p class="sub" id="quedan"></p>
  </div>
</section>
<script>
(() => {
  const code = {{ code|tojson }};
  const $ = (s) => document.querySelector(s);
  const base = `/e/${code}`;
  let k = "", foto = "", mode = "code";
  const post = (u, d) => fetch(base + u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ k }, d || {})) }).then((r) => r.json());
  const li = (t) => { const x = document.createElement("li"); x.textContent = t; return x; };
  fetch(base + "/lista").then((r) => r.json()).then((d) => {
    $("#curso").textContent = `Entregas · ${d.curso}`;
    if (d.consigna) { $("#consigna").hidden = false; $("#ctext").textContent = d.consigna; }
    d.nombres.forEach((n) => { const o = document.createElement("option"); o.value = o.textContent = n; $("#nombre").appendChild(o); });
    d.lenguajes.forEach((n) => { const o = document.createElement("option"); o.value = o.textContent = n; $("#lang").appendChild(o); });
  });
  $("#entrar").addEventListener("click", () => post("/entrar", { nombre: $("#nombre").value, pin: $("#pin").value }).then((r) => {
    if (!r.ok) { $("#lmsg").textContent = r.msg; return; }
    k = r.k; $("#login").hidden = true; $("#send").hidden = false;
    $("#hola").textContent = `¡Hola, ${r.nombre}!` + (r.intentos ? ` Llevas ${r.intentos} intento(s).` : "") + (r.msg ? " " + r.msg : "");
  }));
  const setMode = (m) => { mode = m; $("#tcode").className = m === "code" ? "" : "off"; $("#tfoto").className = m === "foto" ? "" : "off";
    $("#code").hidden = m !== "code"; $("#fotobox").hidden = m !== "foto"; };
  $("#tcode").addEventListener("click", () => setMode("code"));
  $("#tfoto").addEventListener("click", () => setMode("foto"));
  $("#foto").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.onload = () => { const s = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); foto = c.toDataURL("image/jpeg", .85);
      $("#fname").textContent = "Foto lista ✓"; }; img.src = rd.result; };
    rd.readAsDataURL(f);
  });
  $("#enviar").addEventListener("click", () => {
    $("#enviar").disabled = true; $("#smsg").textContent = "Jarvis está revisando…";
    post("/enviar", mode === "foto" ? { lenguaje: $("#lang").value, foto } : { lenguaje: $("#lang").value, codigo: $("#code").value }).then((r) => {
      $("#enviar").disabled = false; $("#smsg").textContent = r.ok ? "" : r.msg;
      if (!r.ok) return;
      $("#rev").hidden = false;
      $("#estado").innerHTML = ""; $("#bien").innerHTML = ""; $("#errores").innerHTML = ""; $("#pista").textContent = "";
      if (!r.revisado) { $("#estado").textContent = r.msg; return; }
      const e = document.createElement("span"); e.className = r.funciona ? "ok" : "bad";
      e.textContent = r.funciona ? "✓ Tu programa hace lo que pide la tarea" : "Todavía no funciona del todo"; $("#estado").append(e);
      if (r.bien.length) { const t = document.createElement("div"); t.className = "tag"; t.textContent = "Lo que está bien"; const u = document.createElement("ul"); r.bien.forEach((x) => u.append(li(x))); $("#bien").append(t, u); }
      if (r.errores.length) { const t = document.createElement("div"); t.className = "tag"; t.textContent = "Para mejorar"; const u = document.createElement("ul"); r.errores.forEach((x) => u.append(li((x.donde ? x.donde + ": " : "") + x.que))); $("#errores").append(t, u); }
      if (r.pista) $("#pista").textContent = "💡 " + r.pista;
      $("#quedan").textContent = r.quedan > 0 ? `Puedes mejorarlo y enviarlo otra vez (te quedan ${r.quedan}).` : "Ya usaste tus intentos.";
    });
  });
})();
</script>
</body>
</html>
