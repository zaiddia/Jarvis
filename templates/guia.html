<!DOCTYPE html>
<html lang="es" data-look="{{ look|default('clasico') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía viva</title>
<style>
  :root { --a: #2ee6ff; --a2: #ffb547; --ok: #3dff9a; --bad: #ff6b6b; --bg: #03060c; --card: #071320; --line: #1d3344; --text: #e6f6ff; --muted: #7d95ab; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 18px 16px 48px; line-height: 1.45; }
  h1 { font-size: 21px; color: var(--a); margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  select, input { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #2a4458; background: var(--card); color: var(--text); margin-bottom: 12px; }
  button { width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; background: var(--a); color: #03060c; margin-bottom: 10px; }
  button.ghost { background: none; border: 1px solid #2a4458; color: var(--text); font-weight: 500; }
  button:disabled { opacity: .5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .tag { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
  .q { font-size: 17px; font-weight: 600; margin-bottom: 14px; white-space: pre-wrap; }
  .op { display: block; width: 100%; text-align: left; padding: 13px; margin-bottom: 9px; border: 1px solid #2a4458; border-radius: 11px; background: #0a1a29;
    color: var(--text); font-size: 16px; font-weight: 500; }
  .op.bad { border-color: var(--bad); opacity: .55; } .op.good { border-color: var(--ok); background: #0b2a1c; }
  .fb { margin: 10px 0; font-size: 15px; } .fb.ok { color: var(--ok); font-weight: 700; } .fb.hint { color: var(--a2); }
  .exp { white-space: pre-wrap; font-size: 15px; color: var(--text); background: #0a1a29; border-radius: 10px; padding: 12px; margin: 8px 0 12px; }
  .msg { color: var(--a2); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  .topics span { display: inline-block; font-size: 13px; border: 1px solid #2a4458; border-radius: 999px; padding: 3px 10px; margin: 0 6px 6px 0; }
  .chat { margin-top: 6px; } .chat p { font-size: 14px; margin-bottom: 8px; } .chat p.me { color: var(--muted); }
  .route { list-style: none; } .route li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; padding: 5px 0; border-bottom: 1px solid #12263a; }
  .route li b { width: 20px; } .route .dominado { color: var(--ok); } .route .actual { color: var(--a); font-weight: 700; } .route .bloqueado { color: #4c6275; }
  .flash { min-height: 150px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .flash .q { font-size: 19px; } .flash .back { color: var(--ok); font-size: 18px; font-weight: 600; margin-top: 10px; white-space: pre-wrap; }
  .row2 { display: flex; gap: 8px; } .row2 button { margin: 0; }
  [hidden] { display: none !important; }
  .blk { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .blk p { font-size: 16px; margin-bottom: 10px; white-space: pre-wrap; }
  .blk ol { margin: 6px 0 8px 20px; } .blk li { margin-bottom: 6px; font-size: 15px; }
  .blk img { width: 100%; border-radius: 10px; background: #fff; }
  .ans { color: var(--ok); font-weight: 700; }
  .flip { border: 1px solid #2a4458; border-radius: 12px; padding: 16px; text-align: center; font-size: 17px; margin-bottom: 8px; min-height: 70px; }
  .flip.back { color: var(--ok); }
  a.labbtn { display: block; text-align: center; padding: 13px; border-radius: 12px; background: var(--a2); color: #03060c; font-weight: 700; text-decoration: none; }
  .op.sel { border-color: var(--a); } .res { font-size: 14px; margin: 4px 0 12px; }
</style>
<style>{% include "_aurora.css" %}</style>
</head>
<body class="page">
<h1 id="tit">Guía viva</h1>
<p class="sub" id="curso"></p>
<div id="blocks"></div>
<section id="quizbox" class="blk" hidden>
  <div class="tag">Mini quiz · entra con tu nombre y PIN para que cuente en tu práctica</div>
  <select id="nombre"><option value="">Escoge tu nombre…</option></select>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="Tu PIN de 4 números (el mismo de la práctica)">
  <div id="qs"></div>
  <button id="enviar">Revisar mis respuestas</button>
  <p class="msg" id="qmsg"></p>
</section>
<script>
(() => {
  const code = {{ code|tojson }};
  const $ = (s) => document.querySelector(s);
  const base = `/g/${code}`;
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  let quiz = [], sel = [], k = "";
  fetch(base + "/datos").then((r) => r.json()).then((d) => {
    $("#tit").textContent = d.titulo || d.tema; $("#curso").textContent = `${d.curso} · ${d.tema}`;
    d.nombres.forEach((n) => { const o = el("option"); o.value = o.textContent = n; $("#nombre").append(o); });
    d.bloques.forEach((b, i) => {
      const box = el("div", "blk");
      if (b.tipo === "explicacion") { box.append(el("div", "tag", "Para entender")); b.texto.split(/\n+/).forEach((p) => box.append(el("p", "", p))); }
      else if (b.tipo === "ejemplo") {
        box.append(el("div", "tag", "Ejemplo resuelto"), el("p", "q", b.enunciado));
        const ol = el("ol"); b.pasos.forEach((p) => ol.append(el("li", "", p.replace(/^\s*\d+[.)]\s*/, "")))); box.append(ol);
        if (b.respuesta) box.append(el("p", "ans", "Respuesta: " + b.respuesta));
      } else if (b.tipo === "grafica") { box.append(el("div", "tag", "Figura")); const im = el("img"); im.src = `${base}/img/${i}.png`; im.alt = b.pie || "Figura"; box.append(im); if (b.pie) box.append(el("p", "sub", b.pie)); }
      else if (b.tipo === "lab") { box.append(el("div", "tag", "Explora"), el("p", "", b.texto || "Mueve los deslizadores y observa qué pasa.")); const a = el("a", "labbtn", "Abrir el laboratorio"); a.href = `/lab/${b.nombre}`; box.append(a); }
      else if (b.tipo === "tarjetas") {
        box.append(el("div", "tag", "Tarjetas · toca para voltear"));
        b.tarjetas.forEach((c) => { const f = el("div", "flip", c.frente); let back = false; f.addEventListener("click", () => { back = !back; f.textContent = back ? c.reverso : c.frente; f.classList.toggle("back", back); }); box.append(f); });
      } else if (b.tipo === "quiz") { quiz = b.preguntas; return; }
      $("#blocks").append(box);
    });
    if (quiz.length) {
      $("#quizbox").hidden = false; sel = quiz.map(() => null);
      quiz.forEach((q, i) => {
        const c = el("div"); c.append(el("p", "q", `${i + 1}. ${q.enunciado}`));
        q.opciones.forEach((o, j) => { const b = el("button", "op", "ABCD"[j] + ") " + o); b.addEventListener("click", () => { sel[i] = j; [...c.querySelectorAll(".op")].forEach((x, n) => x.classList.toggle("sel", n === j)); }); c.append(b); });
        c.append(el("div", "res")); $("#qs").append(c);
      });
    }
  });
  const post = (u, d) => fetch(base + u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }).then((r) => r.json());
  $("#enviar").addEventListener("click", async () => {
    if (!k) { const r = await post("/entrar", { nombre: $("#nombre").value, pin: $("#pin").value }); if (!r.ok) { $("#qmsg").textContent = r.msg; return; } k = r.k; }
    const r = await post("/quiz", { k, respuestas: sel });
    if (!r.ok) { $("#qmsg").textContent = r.msg; return; }
    $("#qmsg").textContent = `Acertaste ${r.aciertos} de ${r.total}. ` + (r.aciertos === r.total ? "¡Excelente! 🎉" : "Revisa las explicaciones.");
    [...$("#qs").children].forEach((c, i) => { const x = r.resultados[i]; const ops = c.querySelectorAll(".op");
      ops.forEach((o, n) => { o.disabled = true; if (n === x.correcta) o.classList.add("good"); else if (n === sel[i]) o.classList.add("bad"); });
      c.querySelector(".res").textContent = (x.ok ? "✓ " : "✗ ") + (x.explicacion || ""); });
    $("#enviar").hidden = true;
  });
})();
</script>
</body>
</html>
