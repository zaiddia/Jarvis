<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calificar hojas</title>
<style>
  :root { --a: #2ee6ff; --a2: #ffb547; --ok: #3dff9a; --bad: #ff6b6b; --bg: #03060c; --text: #e6f6ff; --muted: #7d95ab; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 18px 16px 40px; line-height: 1.4; }
  h1 { font-size: 20px; color: var(--a); }
  .sub { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
  .count { font-size: 15px; margin-bottom: 14px; }
  .count b { color: var(--a); font-size: 22px; }
  label.cam { display: block; text-align: center; padding: 22px 12px; font-size: 19px; font-weight: 700; border-radius: 14px; background: var(--a);
    color: #03060c; margin-bottom: 8px; }
  label.gal { display: block; text-align: center; padding: 11px; font-size: 15px; border-radius: 12px; border: 1px solid #2a4458; color: var(--text); margin-bottom: 16px; }
  input[type=file] { display: none; }
  .tip { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  ul { list-style: none; }
  li { padding: 11px 12px; border: 1px solid #1d3344; border-radius: 10px; margin-bottom: 8px; background: #071320; }
  li .n { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  li .g { font-size: 22px; font-weight: 800; }
  li .g.low { color: var(--bad); } li .g.ok { color: var(--ok); }
  li .d { color: var(--muted); font-size: 13px; margin-top: 3px; }
  li.err { border-color: #5a3a1a; color: var(--a2); }
  li.work { color: var(--muted); }
</style>
</head>
<body>
<h1 id="t">Calificar hojas</h1>
<p class="sub" id="s">Jarvis</p>
<p class="count"><b id="n">0</b> <span id="of"></span> hojas calificadas</p>
<label class="cam" for="cam">📷 Tomar foto de la hoja</label>
<input type="file" id="cam" accept="image/*" capture="environment">
<label class="gal" for="gal">Elegir varias fotos de la galería</label>
<input type="file" id="gal" accept="image/*" multiple>
<p class="tip">Que se vean los 4 cuadros negros de las esquinas, de frente y con buena luz. Si una hoja sale mal, vuelve a tomarle foto: se reemplaza.</p>
<ul id="list"></ul>
<script>
(() => {
  const token = {{ token|tojson }};
  const $ = (s) => document.querySelector(s);
  const base = `/h/${token}`;
  function info() {
    fetch(base + "/datos").then((r) => r.json()).then((d) => {
      if (!d.ok) { $("#t").textContent = "No hay evaluación abierta"; return; }
      $("#t").textContent = d.titulo; $("#s").textContent = `${d.curso} · ${d.preguntas} preguntas`;
      $("#n").textContent = d.n; $("#of").textContent = d.esperados ? `de ${d.esperados}` : "";
    }).catch(() => {});
  }
  function shrink(file) {
    return new Promise((ok) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1800 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob((b) => ok(b || file), "image/jpeg", 0.88);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => ok(file);
      img.src = URL.createObjectURL(file);
    });
  }
  async function send(file) {
    const li = document.createElement("li"); li.className = "work"; li.textContent = "Calificando…";
    $("#list").prepend(li);
    try {
      const blob = await shrink(file);
      const r = await (await fetch(base + "/foto", { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } })).json();
      li.className = r.ok ? "" : "err";
      li.textContent = "";
      if (!r.ok) { li.textContent = r.msg || "No pude leer la hoja."; return; }
      const n = document.createElement("div"); n.className = "n";
      const nm = document.createElement("span"); nm.textContent = r.nombre;
      const g = document.createElement("span"); g.className = "g " + (r.nota < 3 ? "low" : "ok"); g.textContent = String(r.nota.toFixed(1)).replace(".", ",");
      n.append(nm, g);
      const d = document.createElement("div"); d.className = "d";
      d.textContent = `${r.aciertos} de ${r.total}` + (r.malas.length ? ` · erró: ${r.malas.join(", ")}` : " · ¡todas bien!") +
        (r.multi.length ? ` · doble marca: ${r.multi.join(", ")}` : "") + (r.origen === "ia" ? " · leída con IA" : "");
      li.append(n, d);
      $("#n").textContent = r.n;
      if (navigator.vibrate) navigator.vibrate(60);
    } catch (e) { li.className = "err"; li.textContent = "Sin conexión con Jarvis. ¿Estás en la misma wifi?"; }
  }
  async function many(e) { for (const f of [...e.target.files]) await send(f); e.target.value = ""; }
  $("#cam").addEventListener("change", many);
  $("#gal").addEventListener("change", many);
  info(); setInterval(info, 8000);
})();
</script>
</body>
</html>
