<!DOCTYPE html>
<html lang="es" data-look="{{ look|default('aurora') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto de la semana</title>
<style>
  :root { --a: #2ee6ff; --a2: #ffb547; --ok: #3dff9a; --bad: #ff6b6b; --bg: #03060c; --card: #071320; --line: #1d3344; --text: #e6f6ff; --muted: #7d95ab; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 18px 16px 48px; line-height: 1.45; }
  h1 { font-size: 21px; color: var(--a); margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  select, input { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #2a4458; background: var(--card); color: var(--text); margin-bottom: 12px; }
  button { width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; background: var(--a); color: #03060c; margin-bottom: 10px; }
  button.ghost { background: none; border: 1px solid #2a4458; color: var(--text); font-weight: 500; }
  button:disabled { opacity: .5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .tag { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
  .q { font-size: 17px; font-weight: 600; margin-bottom: 14px; white-space: pre-wrap; }
  .op { display: block; width: 100%; text-align: left; padding: 13px; margin-bottom: 9px; border: 1px solid #2a4458; border-radius: 11px; background: #0a1a29;
    color: var(--text); font-size: 16px; font-weight: 500; }
  .op.bad { border-color: var(--bad); opacity: .55; } .op.good { border-color: var(--ok); background: #0b2a1c; }
  .fb { margin: 10px 0; font-size: 15px; } .fb.ok { color: var(--ok); font-weight: 700; } .fb.hint { color: var(--a2); }
  .exp { white-space: pre-wrap; font-size: 15px; color: var(--text); background: #0a1a29; border-radius: 10px; padding: 12px; margin: 8px 0 12px; }
  .msg { color: var(--a2); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  .topics span { display: inline-block; font-size: 13px; border: 1px solid #2a4458; border-radius: 999px; padding: 3px 10px; margin: 0 6px 6px 0; }
  .chat { margin-top: 6px; } .chat p { font-size: 14px; margin-bottom: 8px; } .chat p.me { color: var(--muted); }
  [hidden] { display: none !important; }
  textarea { width: 100%; min-height: 220px; padding: 12px; font: 14px/1.4 ui-monospace, Consolas, monospace; border-radius: 10px; border: 1px solid #2a4458;
    background: #050d17; color: var(--text); margin-bottom: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  ul { margin: 6px 0 10px 18px; } li { margin-bottom: 6px; font-size: 15px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; } .tabs button { margin: 0; } .tabs button.off { background: none; border: 1px solid #2a4458; color: var(--text); font-weight: 500; }
  .lvl { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
  .Bronce { background: #5a3a1c; color: #ffcf9e; } .Plata { background: #3b4552; color: #e2ebf3; } .Oro { background: #5c4a0f; color: #ffe27a; }
  .badges span { display: inline-block; font-size: 14px; border: 1px solid #2a4458; border-radius: 999px; padding: 3px 10px; margin: 0 6px 6px 0; }
</style>
<style>{% include "_aurora.css" %}</style>
</head>
<body class="page">
<h1>🏆 Reto de la semana</h1>
<p class="sub" id="curso">Matemáticas</p>
<section id="login" class="card">
  <select id="nombre"><option value="">Escoge tu nombre…</option></select>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="Tu PIN de 4 números (el mismo de la práctica)">
  <button id="entrar">Entrar</button>
  <p class="msg" id="lmsg"></p>
</section>
<section id="home" hidden>
  <div class="card"><p id="hola" class="q"></p><div class="badges" id="badges"></div></div>
  <div id="qs"></div>
</section>
<script>
(() => {
  const code = {{ code|tojson }};
  const $ = (s) => document.querySelector(s);
  const base = `/r/${code}`;
  let k = "", nombre = "";
  const post = (u, d) => fetch(base + u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ k }, d || {})) }).then((r) => r.json());
  fetch(base + "/lista").then((r) => r.json()).then((d) => {
    $("#curso").textContent = `${d.curso}` + (d.tema ? ` · ${d.tema}` : "");
    d.nombres.forEach((n) => { const o = document.createElement("option"); o.value = o.textContent = n; $("#nombre").appendChild(o); });
  });
  function draw(r, msgFor, msg) {
    $("#hola").textContent = `¡Hola, ${nombre}! Puntos acumulados: ${String(r.total).replace(".", ",")}`;
    $("#badges").innerHTML = ""; r.insignias.forEach((b) => { const s = document.createElement("span"); s.textContent = b; $("#badges").append(s); });
    $("#qs").innerHTML = "";
    r.preguntas.forEach((q, i) => {
      const c = document.createElement("div"); c.className = "card";
      const l = document.createElement("span"); l.className = "lvl " + q.nivel; l.textContent = q.nivel + (q.nivel === "Bronce" ? " · 1 pt" : q.nivel === "Plata" ? " · 2 pts" : " · 3 pts");
      const p = document.createElement("p"); p.className = "q"; p.textContent = q.enunciado;
      c.append(l, p);
      q.opciones.forEach((o, j) => {
        const b = document.createElement("button"); b.className = "op" + (q.estado === "ok" ? "" : ""); b.textContent = "ABCD"[j] + ") " + o;
        b.disabled = q.estado === "ok" || q.estado === "fin";
        b.addEventListener("click", () => post("/responder", { q: i, opcion: j }).then((x) => { if (!x.ok) { alertMsg(x.msg); return; } draw(x, i, x.msg); }));
        c.append(b);
      });
      const f = document.createElement("p"); f.className = "fb" + (q.estado === "ok" ? " ok" : " hint");
      f.textContent = msgFor === i ? msg : q.estado === "ok" ? "✓ Resuelta" : q.estado === "fin" ? "Sin más intentos" : q.estado === "uno" ? "Te queda un intento" : "";
      c.append(f);
      if (q.explicacion) { const e = document.createElement("div"); e.className = "exp"; e.textContent = q.explicacion; c.append(e); }
      $("#qs").append(c);
    });
  }
  const alertMsg = (m) => { $("#hola").textContent = m; };
  $("#entrar").addEventListener("click", () => post("/entrar", { nombre: $("#nombre").value, pin: $("#pin").value }).then((r) => {
    if (!r.ok) { $("#lmsg").textContent = r.msg; return; }
    k = r.k; nombre = r.nombre; $("#login").hidden = true; $("#home").hidden = false; draw(r);
  }));
})();
</script>
</body>
</html>
